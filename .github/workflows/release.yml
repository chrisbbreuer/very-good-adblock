name: Release

on:
  schedule:
    # Chrome and Apple allow only one version in review. Retry the current
    # release automatically after either store finishes reviewing its predecessor.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      github-release-only:
        description: Build packages and create or repair the GitHub Release only
        type: boolean
        default: false
      release-tag:
        description: Existing tag to repair; defaults to v<package.json version>
        type: string
        required: false
      publish-chrome:
        description: Publish or retry Chrome
        type: boolean
        default: true
      publish-firefox:
        description: Publish or retry Firefox
        type: boolean
        default: true
      publish-safari:
        description: Publish or retry Safari
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release-tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    uses: stacksjs/stacks/.github/workflows/browser-extension-release.yml@v0.70.150
    with:
      chrome-publisher-id: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
      safari-enabled: ${{ vars.ENABLE_SAFARI_PUBLISH == 'true' }}
      publish-stores: ${{ github.event_name != 'workflow_dispatch' || !inputs.github-release-only }}
      publish-chrome: ${{ github.event_name != 'workflow_dispatch' || inputs.publish-chrome }}
      publish-firefox: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.publish-firefox) }}
      publish-safari: ${{ github.event_name != 'workflow_dispatch' || inputs.publish-safari }}
      release-tag: ${{ inputs.release-tag || '' }}
    secrets:
      CHROME_WEB_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_WEB_STORE_SERVICE_ACCOUNT_JSON }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

  # The very-good-adblock library (config/library.ts): the extension's rules
  # and content scripts for WebKit apps, rebuilt from this tag and published to
  # npm. Only on a tag push: the scheduled store retries must not republish.
  # npm trusted publishing mints the credential from id-token; no token is
  # passed, so a stale one can never take the publish.
  library:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@cdb82193cb344c2b881a88ea79f88243f5522e0f # v0.11.75
        with:
          version: '0.11.75'
          install: 'false'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the library
        run: bun run build:libs

      - name: Publish the library
        run: bun run libs:publish
